# Optionally load the repository-level .env file when running locally.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT:8001}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/swcup?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USER:swcup}
spring.datasource.password=${MYSQL_PASSWORD:}

# JWT (required outside tests; use a long random value)
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Logging
logging.level.org.springframework.jdbc.core=${SQL_LOG_LEVEL:INFO}
logging.level.org.springframework.data.redis=${REDIS_LOG_LEVEL:INFO}
logging.level.org.springframework.cache=${CACHE_LOG_LEVEL:INFO}

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml,classpath:mapper/**/*.xml

# Neo4j
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms
spring.cache.redis.time-to-live=600000ms
spring.cache.redis.cache-null-values=false
